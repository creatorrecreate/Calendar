<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友約會月曆 Calendar</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --selected: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px 10px; max-width: 900px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }

    .user-section { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .user-section label { font-weight: 600; }
    input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; flex: 1; min-width: 150px; }

    .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekday { font-weight: bold; color: var(--text-muted); padding: 8px 0; font-size: 0.85rem; }
    .day-cell { border: 1px solid var(--border); border-radius: 8px; min-height: 80px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; background: #fff; transition: 0.15s; }
    .day-cell:hover { border-color: var(--primary); }
    .day-cell.other-month { opacity: 0.3; background: #f1f5f9; cursor: default; }
    .day-cell.is-selected { background: #f0fdf4; border-color: #22c55e; }
    .day-number { font-weight: 600; font-size: 0.9rem; text-align: right; }
    
    .avail-tags { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
    .tag { background: #e0e7ff; color: #3730a3; font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; }
    .tag.me { background: #dcfce7; color: #166534; font-weight: bold; }

    .action-bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    
    textarea { width: 100%; height: 80px; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: monospace; font-size: 0.85rem; }
    
    .summary-list { list-style: none; margin-top: 10px; }
    .summary-item { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .highlight { font-weight: bold; color: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>📅 朋友聚會月曆</h1>
    <p class="subtitle">選取你得閒嘅日子，撳「確定儲存」即可記錄！</p>
  </header>

  <div class="card">
    <div class="user-section">
      <label for="userName">你的名字：</label>
      <input type="text" id="userName" placeholder="輸入名字 (例如: Alex)" onchange="saveUserName()">
    </div>
  </div>

  <div class="card">
    <div class="calendar-controls">
      <button class="btn btn-secondary" onclick="changeMonth(-1)">‹ 上一個月</button>
      <h2 id="currentMonthStr"></h2>
      <button class="btn btn-secondary" onclick="changeMonth(1)">下一個月 ›</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="action-bar">
      <button class="btn" style="background:#22c55e;" onclick="confirmSave()">✅ 確定 / 儲存我嘅日子</button>
    </div>
  </div>

  <div class="card">
    <h3>🏆 最多人得閒嘅日子 (熱門排行榜)</h3>
    <ul class="summary-list" id="summaryList"></ul>
  </div>

  <div class="card">
    <h3>🔄 同步資料給朋友</h3>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">複製下方代碼發送到 WhatsApp 群組，朋友貼上即可同步：</p>
    <div style="margin-top: 10px; display: flex; gap: 8px;">
      <button class="btn btn-secondary" onclick="exportData()">📤 複製資料代碼</button>
      <button class="btn btn-secondary" onclick="importData()">📥 貼上並匯入資料</button>
    </div>
    <textarea id="dataBox" placeholder="點擊「複製」將代碼複製，或在這裡貼上朋友發送的代碼後點擊「匯入」..."></textarea>
  </div>

  <script>
    let currentDate = new Date();
    let storeData = JSON.parse(localStorage.getItem('friends_calendar_db') || '{}');
    let mySelections = new Set();

    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

    function init() {
      const savedName = localStorage.getItem('friends_calendar_user') || '';
      document.getElementById('userName').value = savedName;
      loadMySelections();
      renderCalendar();
      renderSummary();
    }

    function saveUserName() {
      const name = document.getElementById('userName').value.trim();
      localStorage.setItem('friends_calendar_user', name);
      loadMySelections();
      renderCalendar();
    }

    function loadMySelections() {
      const name = document.getElementById('userName').value.trim();
      mySelections.clear();
      if (!name) return;
      
      for (let dateStr in storeData) {
        if (storeData[dateStr].includes(name)) {
          mySelections.add(dateStr);
        }
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('currentMonthStr').innerText = `${year} 年 ${month + 1} 月`;
      
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      weekDays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.innerText = day;
        grid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        grid.appendChild(cell);
      }

      const myName = document.getElementById('userName').value.trim();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        
        if (mySelections.has(dateStr)) {
          cell.classList.add('is-selected');
        }

        cell.onclick = () => toggleDay(dateStr);

        let tagsHTML = '<div class="avail-tags">';
        const friends = storeData[dateStr] || [];
        friends.forEach(f => {
          const isMe = f === myName;
          tagsHTML += `<span class="tag ${isMe ? 'me' : ''}">${f}</span>`;
        });
        tagsHTML += '</div>';

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          ${tagsHTML}
        `;
        grid.appendChild(cell);
      }
    }

    function toggleDay(dateStr) {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('請先在上方輸入你的名字！');
        return;
      }

      if (mySelections.has(dateStr)) {
        mySelections.delete(dateStr);
      } else {
        mySelections.add(dateStr);
      }
      renderCalendar();
    }

    function confirmSave() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('請先輸入你的名字！');
        return;
      }

      for (let dateStr in storeData) {
        storeData[dateStr] = storeData[dateStr].filter(f => f !== name);
        if (storeData[dateStr].length === 0) delete storeData[dateStr];
      }

      mySelections.forEach(dateStr => {
        if (!storeData[dateStr]) storeData[dateStr] = [];
        if (!storeData[dateStr].includes(name)) {
          storeData[dateStr].push(name);
        }
      });

      localStorage.setItem('friends_calendar_db', JSON.stringify(storeData));
      alert('已成功確定並儲存你的得閒日子！紀錄已更新。');
      renderCalendar();
      renderSummary();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderSummary() {
      const list = document.getElementById('summaryList');
      list.innerHTML = '';

      const entries = Object.entries(storeData)
        .map(([date, friends]) => ({ date, count: friends.length, friends }))
        .sort((a, b) => b.count - a.count);

      if (entries.length === 0) {
        list.innerHTML = '<li style="color:var(--text-muted); padding:10px 0;">暫時未有人選擇得閒日子。</li>';
        return;
      }

      entries.slice(0, 5).forEach(item => {
        const li = document.createElement('li');
        li.className = 'summary-item';
        li.innerHTML = `
          <span><strong>${item.date}</strong> (${item.friends.join(', ')})</span>
          <span class="highlight">${item.count} 人得閒</span>
        `;
        list.appendChild(li);
      });
    }

    function exportData() {
      const str = JSON.stringify(storeData);
      const box = document.getElementById('dataBox');
      box.value = str;
      box.select();
      navigator.clipboard.writeText(str);
      alert('已將資料代碼複製到剪貼簿！你可以貼給 WhatsApp 群組嘅朋友。');
    }

    function importData() {
      const box = document.getElementById('dataBox');
      if (!box.value.trim()) {
        alert('請先在文字框貼上朋友給你的代碼！');
        return;
      }
      try {
        const imported = JSON.parse(box.value.trim());
        storeData = { ...storeData, ...imported };
        localStorage.setItem('friends_calendar_db', JSON.stringify(storeData));
        loadMySelections();
        renderCalendar();
        renderSummary();
        alert('成功匯入並合併朋友嘅資料！');
      } catch(e) {
        alert('代碼格式不正確，請再試一次。');
      }
    }

    init();
  </script>
</body>
</html>
