<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友約會月曆 Calendar</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --selected: #ef4444; /* 紅色代表唔得閒 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px 10px; max-width: 900px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }

    .user-section { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .user-section label { font-weight: 600; }
    input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; flex: 1; min-width: 150px; }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-badge.connected { background: #dcfce7; color: #166534; }
    .status-badge.connecting { background: #fef3c7; color: #92400e; }
    .status-badge.error { background: #fee2e2; color: #991b1b; }

    .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekday { font-weight: bold; color: var(--text-muted); padding: 8px 0; font-size: 0.85rem; }
    .day-cell { border: 1px solid var(--border); border-radius: 8px; min-height: 80px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; background: #fff; transition: 0.15s; }
    .day-cell:hover { border-color: var(--primary); }
    .day-cell.other-month { opacity: 0.3; background: #f1f5f9; cursor: default; }
    .day-cell.is-selected { background: #fef2f2; border-color: #ef4444; } /* 唔得閒用紅調 */
    .day-number { font-weight: 600; font-size: 0.9rem; text-align: right; }
    
    .avail-tags { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
    .tag { background: #fee2e2; color: #991b1b; font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; }
    .tag.me { background: #ef4444; color: #ffffff; font-weight: bold; }

    .action-bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    
    .summary-list { list-style: none; margin-top: 10px; }
    .summary-item { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .highlight { font-weight: bold; color: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>📅 朋友聚會月曆</h1>
    <p class="subtitle">選取你<strong>唔得閒</strong>嘅日子（紅色），撳「確定儲存」即可自動上傳同步！</p>
  </header>

  <div class="card">
    <div class="user-section">
      <label for="userName">你的名字：</label>
      <input type="text" id="userName" placeholder="輸入名字 (例如: Alex)" onchange="saveUserName()">
      <span id="syncStatus" class="status-badge connecting">🟡 連線中...</span>
    </div>
  </div>

  <div class="card">
    <div class="calendar-controls">
      <button class="btn btn-secondary" onclick="changeMonth(-1)">‹ 上一個月</button>
      <h2 id="currentMonthStr"></h2>
      <button class="btn btn-secondary" onclick="changeMonth(1)">下一個月 ›</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="action-bar">
      <button class="btn" style="background:#ef4444;" onclick="confirmSave()">✅ 確定 / 儲存我唔得閒嘅日子</button>
      <button class="btn btn-secondary" onclick="fetchCloudData()">🔄 重新整理 / 同步最新資料</button>
    </div>
  </div>

  <div class="card">
    <h3>🏆 最多人得閒嘅日子 (熱門排行榜)</h3>
    <ul class="summary-list" id="summaryList"></ul>
  </div>

  <!-- Firebase JavaScript SDK Modular Version -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application state
    window.currentDate = new Date();
    window.storeData = {};
    window.mySelections = new Set();
    window.weekDays = ['日', '一', '二', '三', '四', '五', '六'];

    // Safe environment setup
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-friends-calendar-2026';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoConfigKey",
          authDomain: "friends-calendar-demo.firebaseapp.com",
          projectId: "friends-calendar-demo",
          storageBucket: "friends-calendar-demo.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:abcdef123456"
        };

    let app, auth, db;
    let isCloudReady = false;

    // Update status badge UI
    function updateStatus(state, text) {
      const badge = document.getElementById('syncStatus');
      if (!badge) return;
      badge.className = `status-badge ${state}`;
      badge.innerText = text;
    }

    // Initialize Firebase Realtime Data Listener
    async function initFirebase() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Authenticate user
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        // Shared Document path following strict artifacts rule
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_shared', 'global_data');

        // Real-time Firestore snapshot listener
        onSnapshot(docRef, (snapshot) => {
          isCloudReady = true;
          updateStatus('connected', '🟢 雲端同步連線中');
          
          if (snapshot.exists()) {
            window.storeData = snapshot.data().dates || {};
          } else {
            window.storeData = {};
          }

          window.loadMySelections();
          window.renderCalendar();
          window.renderSummary();
        }, (error) => {
          console.warn("Firestore listener error, using local fallback:", error);
          updateStatus('error', '🔴 離線模式 (資料本地暫存)');
          fallbackToLocalStorage();
        });

      } catch (err) {
        console.warn("Firebase Auth or Init failed, using local storage:", err);
        updateStatus('error', '🔴 離線模式 (資料本地暫存)');
        fallbackToLocalStorage();
      }
    }

    function fallbackToLocalStorage() {
      const local = localStorage.getItem('friends_calendar_busy_db');
      window.storeData = local ? JSON.parse(local) : {};
      window.loadMySelections();
      window.renderCalendar();
      window.renderSummary();
    }

    // Window global functions for user interactions
    window.saveUserName = function() {
      const name = document.getElementById('userName').value.trim();
      localStorage.setItem('friends_calendar_user', name);
      window.loadMySelections();
      window.renderCalendar();
    };

    window.loadMySelections = function() {
      const name = document.getElementById('userName').value.trim();
      window.mySelections.clear();
      if (!name) return;

      for (let dateStr in window.storeData) {
        if (Array.isArray(window.storeData[dateStr]) && window.storeData[dateStr].includes(name)) {
          window.mySelections.add(dateStr);
        }
      }
    };

    window.renderCalendar = function() {
      const year = window.currentDate.getFullYear();
      const month = window.currentDate.getMonth();

      document.getElementById('currentMonthStr').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      window.weekDays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.innerText = day;
        grid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        grid.appendChild(cell);
      }

      const myName = document.getElementById('userName').value.trim();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        if (window.mySelections.has(dateStr)) {
          cell.classList.add('is-selected');
        }

        cell.onclick = () => window.toggleDay(dateStr);

        let tagsHTML = '<div class="avail-tags">';
        const friends = window.storeData[dateStr] || [];
        friends.forEach(f => {
          const isMe = f === myName;
          tagsHTML += `<span class="tag ${isMe ? 'me' : ''}">${f}</span>`;
        });
        tagsHTML += '</div>';

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          ${tagsHTML}
        `;
        grid.appendChild(cell);
      }
    };

    window.toggleDay = function(dateStr) {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('請先在上方輸入你的名字！');
        return;
      }

      if (window.mySelections.has(dateStr)) {
        window.mySelections.delete(dateStr);
      } else {
        window.mySelections.add(dateStr);
      }
      window.renderCalendar();
    };

    window.confirmSave = async function() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('請先輸入你的名字！');
        return;
      }

      // Clean existing records for this user
      for (let dateStr in window.storeData) {
        if (Array.isArray(window.storeData[dateStr])) {
          window.storeData[dateStr] = window.storeData[dateStr].filter(f => f !== name);
          if (window.storeData[dateStr].length === 0) {
            delete window.storeData[dateStr];
          }
        }
      }

      // Add new selections for this user
      window.mySelections.forEach(dateStr => {
        if (!window.storeData[dateStr]) window.storeData[dateStr] = [];
        if (!window.storeData[dateStr].includes(name)) {
          window.storeData[dateStr].push(name);
        }
      });

      // Save to Firebase Cloud
      try {
        if (isCloudReady && auth.currentUser) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_shared', 'global_data');
          await setDoc(docRef, { dates: window.storeData, updatedAt: new Date().toISOString() }, { merge: true });
        } else {
          localStorage.setItem('friends_calendar_busy_db', JSON.stringify(window.storeData));
        }
        alert('已成功上傳並儲存你「唔得閒」嘅日子！');
      } catch (e) {
        console.error("Cloud save failed:", e);
        localStorage.setItem('friends_calendar_busy_db', JSON.stringify(window.storeData));
        alert('儲存完成 (暫存於本地)。');
      }

      window.renderCalendar();
      window.renderSummary();
    };

    window.changeMonth = function(delta) {
      window.currentDate.setMonth(window.currentDate.getMonth() + delta);
      window.renderCalendar();
    };

    window.fetchCloudData = function() {
      if (!isCloudReady) {
        fallbackToLocalStorage();
      }
      window.renderCalendar();
      window.renderSummary();
    };

    window.renderSummary = function() {
      const list = document.getElementById('summaryList');
      list.innerHTML = '';

      // Find all unique users across all marked unavailable dates
      const allUsers = new Set();
      Object.values(window.storeData).forEach(userList => {
        if (Array.isArray(userList)) {
          userList.forEach(u => allUsers.add(u));
        }
      });

      const totalUsers = allUsers.size;

      if (totalUsers === 0) {
        list.innerHTML = '<li style="color:var(--text-muted); padding:10px 0;">暫時未有人標記唔得閒日子。</li>';
        return;
      }

      const year = window.currentDate.getFullYear();
      const month = window.currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const availableDaysList = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const busyUsers = window.storeData[dateStr] || [];
        
        // Available users = All users minus unavailable users on this date
        const freeUsers = Array.from(allUsers).filter(u => !busyUsers.includes(u));

        availableDaysList.push({
          date: dateStr,
          availableCount: freeUsers.length,
          freeUsers: freeUsers
        });
      }

      // Sort by highest available count first
      availableDaysList.sort((a, b) => b.availableCount - a.availableCount);

      // Display Top 5 available days
      availableDaysList.slice(0, 5).forEach(item => {
        const li = document.createElement('li');
        li.className = 'summary-item';
        const freeNamesStr = item.freeUsers.length > 0 ? item.freeUsers.join(', ') : '無人得閒';
        li.innerHTML = `
          <span><strong>${item.date}</strong> (得閒: ${freeNamesStr})</span>
          <span class="highlight">${item.availableCount} 人得閒</span>
        `;
        list.appendChild(li);
      });
    };

    // Initialize on document load
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('friends_calendar_user') || '';
      document.getElementById('userName').value = savedName;
      initFirebase();
    });
  </script>
</body>
</html>
